# suricata-update: ET Open rule groups left out to keep Suricata small on a 1 GB VM.
# They watch traffic this honeypot never produces (users browsing, mail, chat, games) or
# only describe policy, not attacks. Everything that sees inbound attacks stays on:
# scan, exploit, web_server, web_specific_apps, attack_response, shellcode, worm, sql, telnet, smb,
# netbios, rpc, dos, misc, coinminer, malware, and the bad-IP lists (compromised, ciarmy, drop, dshield).
