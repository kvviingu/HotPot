# Single rules that only say "someone connected to a decoy port". The decoys log every one of those
# connections themselves, with more detail; in the first day these four were 83% of all alerts.
# (The dashboard hides them too, so older alerts stop drowning out the rest: IDS_NOISE in server.py.)
# MS Remote Desktop Administrator Login Request (every RDP decoy login)
2012709
# Behavioral unusually fast Terminal Server traffic (RDP decoy brute force)
2001972
# Suspicious inbound to mySQL port 3306 (MySQL decoy)
2010937
# TCPv4 invalid checksum (NIC checksum offload on the capture interface, not an attack)
2200074
