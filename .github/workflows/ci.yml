name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every Python file
        run: python -m compileall -q hotpot.py persona.py dashboard web decoys backend cowrie tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: hotpot starts
        run: |
          python hotpot.py version
          python hotpot.py --help

  scripts:
    name: Shell and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Shell scripts parse
        run: |
          set -e
          for f in $(git ls-files '*.sh') hotpot; do bash -n "$f"; echo "ok  $f"; done
      - name: Dashboard JavaScript parses
        run: |
          set -e
          for f in dashboard/static/*.js; do node --check "$f"; echo "ok  $f"; done
      - name: Compose file is valid
        env:
          FRONT_PRIVATE_IP: 10.0.0.15   # placeholder; real installs take it from honeypot.conf
        run: docker compose -f docker-compose.yml config -q
